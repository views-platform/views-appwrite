# ------------------------------------------------------- secret SLOTS (no values!)
[secret.APPWRITE_DATASTORE_API_KEY]
class = "secret"
carrier = "env var"
issued_by = "operator"
console_key_name = "VIEWS Pipeline Core"
serves_identities = [
  "model/ensemble writer -> production_forecasts",
  "un_fao delivery -> sole writer of unfao_bucket",
  "preflights / validators",
]
observed = """2026-07-31, operator console: 20 scopes, expires ~2026-11-30.
VIOLATES PLATFORM-001 §5.3 — one key, three identities. Read by BOTH
views-pipeline-core/views_pipeline_core/configs/prediction_store.py:16 and
views-postprocessing/views_postprocessing/unfao/managers/unfao.py:187, so the
publisher into FAO's outbound bucket runs under a key named for another service."""
note = """RETIRED by reissuance under PLATFORM-001 §5 — but NOT by console action alone:
the incumbent client's ordinary upload path provisions transitively (§5.5 table), so
narrowing scopes today breaks every upload. Order: ship the create_* gating, THEN narrow.
The narrowing is the acceptance test for the §6 change."""

# The caller's key — NOT a platform identity. Listed because it crosses the seam.
[secret.FAO_CALLER_API_KEY]
class = "secret"
carrier = "X-API-Key request header (presented by the caller to views-faoapi, re-used by it)"
console_key_name = "UN FAO"
issued_by = "operator"
owning_contract = "views-faoapi (local ADR) — the compromise and its remediation are that repo's"
observed = """2026-07-31, operator console: 20 scopes, expires ~2026-11-30.
Serves FAO + developer/ops use simultaneously (PLATFORM-001 §5.3 violation), and the
value is present in views-faoapi git history. Remediation sequencing is the operator's
decision, recorded in views-faoapi; this registry records the slot, not the incident."""
open_item = "O2 — confused-deputy half unresolved (PLATFORM-001 §9)"

[secret.APPWRITE_READ_API_KEY]
class = "secret"
status = "planned — operator issues (D4)"
identity = "one per reading identity x environment (§5.3) — not one shared read key"
scopes = "files.read, documents.read, databases.read"

[secret.APPWRITE_WRITE_API_KEY]
class = "secret"
status = "planned — operator issues (D4). Blocked on the create_* gating (§5.5)."
identity = "one per writing identity x environment — views-delivery and un_fao delivery are DIFFERENT identities"
scopes = "files.read, files.write, documents.read, documents.write, buckets.read, databases.read, collections.read"

[secret.APPWRITE_PROVISION_API_KEY]
class = "secret"
status = "planned — operator issues (D4). NEVER given to a long-running process."
scopes = "buckets.write, databases.write, collections.write, attributes.write"

# Not a slot yet — a carrier with no home. See PLATFORM-001 §9 O3.
[unmodelled.session_auth_email_password]
class = "secret (carrier: email + password)"
location = "views-pipeline-core/views_pipeline_core/modules/appwrite/file.py:359-412 (SessionAuth)"
note = """Fits none of §5.2's three tiers, appears in no slot, invisible to the §5.7
registry check. The excision recorded in §2 is views-faoapi #274 and covers faoapi only.
Either excise on the pipeline-core lineage too, or declare it as a slot with an owner."""

# ------------------------------------- explicit exclusions (listed, not governed)
[excluded.APPWRITE_UNFAO_APPROVED_FILE_IDS]
class = "policy"
owning_contract = "views-models ADR-017 (eligibility)"
note = "Eligibility DATA, not configuration — despite the prefix (D3)."

[excluded.APPWRITE_UNFAO_QUARANTINED_FILE_IDS]
class = "policy"
owning_contract = "views-models ADR-017 (eligibility)"

[excluded.netrc_entry]
class = "secret (carrier: ~/.netrc)"
owning_contract = "views-datafactory ADR-026 + credential_setup.md"
note = "The sole co-resident secret a full delivery runtime needs besides the Appwrite key."

[excluded.harvest_tokens]
names = ["ACLED_PASSWORD", "GDL_API_TOKEN", "UCDP_API_TOKEN"]
owning_contract = "views-datafactory ADR-026"
note = "Needed only where harvests run. NO consumer runtime needs them (þing-01 S26)."

[excluded.legacy_store_and_wandb]
note = "views-forecasts store credentials (retire with the store) and W&B keys — out of scope, named."

# ------------------------------------------------------------------ test column
[test_environment]
status = "none"
fact = """No non-production Appwrite project exists (þing-01 S23, five-seat testimony).
Until the operator creates one: integration tests against the production project are
FORBIDDEN by PLATFORM-001; read-only preflight validation is the only permitted live check."""

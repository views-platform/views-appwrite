# ------------------------------------------- INCOMING CONSUMERS (values pending)
#
# ⚠ THESE LIVE IN [planned.*], NOT [target.*], AND THAT IS LOAD-BEARING.
#
# Both canonical readers (views-models/tools/registry_to_env.py:28,39-40 and
# views-faoapi/deployment/registry_to_env.py) scan exactly two tables —
# `connection` and `target` — and RAISE on any entry in them without a `value`:
#
#     ValueError: registry coordinate 'X' (class 'target') has no value
#
# A value-less slot in [target] therefore does not degrade the reader, it KILLS
# it — and un_fao/run.sh exports only GITHUB_TOKEN and APPWRITE_DATASTORE_API_KEY
# from .env, so coordinates reach the child process ONLY from the registry. One
# unreadable registry means the delivery runs with NO coordinates at all.
#
# That happened: commit 2186d45 put these four in [target] and every registry
# read across the platform failed from then until this fix. A planned slot is a
# DECLARATION OF INTENT, not a coordinate; it becomes a coordinate the day it has
# a value, and only then does it move to [target].
#
# Two consumer APIs are about to be cloned from views-faoapi. Their slots are
# declared HERE, BEFORE the repos exist, because §5.3's credential floor is
# "free at creation and a migration afterwards" — which only holds if there is
# somewhere to read a coordinate from on day one. A repo that finds no slot
# invents one locally, which is the pathology this registry exists to remove.
#
# status = "planned" means: the SLOT is canonical, the VALUE is not yet decided.
# Do NOT fill these with plausible-looking placeholders. A placeholder that later
# gets used verbatim is the "production coordinates reachable without a
# deliberate choice" hazard class (views-appwrite C-21). The operator sets the
# values in the console; this file records them afterwards.
#
# NAMING: the þing-02 record calls the CRAFD consumer "un-crafdapi" (28
# occurrences). The operator has since named it "views-crafdapi", which also
# matches the views-* convention every other repo on the platform follows. This
# file uses views-crafdapi; the former name is recorded so the þing record stays
# findable.

# The four CRAFD slots below rest on an INFERENCE, declared here rather than left
# silent (ADR-003: declarations over inference). views-crafdapi is a direct clone
# of views-faoapi serving a second external party, and faoapi's shape is
# "external party reads a curated outbound bucket" — so a bucket of its own is
# the clone's shape, not a new decision. Confirm at creation; if CRAFD instead
# reads an existing container, delete these rather than leaving them to look
# canonical.

[planned.APPWRITE_CRAFD_BUCKET_ID]
class = "target"
status = "planned — views-crafdapi (þing-02 record: 'un-crafdapi')"
consumer = "views-crafdapi"

[planned.APPWRITE_CRAFD_BUCKET_NAME]
class = "target"
status = "planned"
consumer = "views-crafdapi"

[planned.APPWRITE_CRAFD_COLLECTION_ID]
class = "target"
status = "planned"
consumer = "views-crafdapi"

[planned.APPWRITE_CRAFD_COLLECTION_NAME]
class = "target"
status = "planned"
consumer = "views-crafdapi"

# views-productionapi has NO target slots here, deliberately.
#
# Everything the record establishes about it is that it is "a write API by
# definition" (þing-02 orð_13 §2, þingmenn). Nothing says it needs its own
# bucket. The unfao_bucket precedent does NOT generalise: FAO has a separate
# bucket because it receives a CURATED SUBSET — which is why the eligibility
# lists exist — and a write API may simply write to production_forecasts, the
# shelf that already exists.
#
# Declaring slots for a container nobody has decided on would assert an
# architecture as canonical when no one chose it, which is the same defect as
# filling in a placeholder value. It also risks C-228: a coordinate named
# APPWRITE_PRODUCTIONAPI_BUCKET_ID sits one glance away from
# APPWRITE_PROD_FORECASTS_BUCKET_ID in a sorted .env, and a wrong bucket id
# silently provisions new production storage rather than failing.
#
# OPEN QUESTION, to be answered before views-productionapi is cut:
#   does it write to production_forecasts, or to a store of its own?
# If a store of its own, add the slots then — with a token that cannot be
# misread against PROD_FORECASTS.
#
# Its CREDENTIAL slot is declared regardless (see PRODUCTIONAPI_API_KEY below):
# §5.3's floor binds on the holder, not on which container it touches.

# ------------------------------------------------------- secret SLOTS (no values!)
[secret.APPWRITE_DATASTORE_API_KEY]
class = "secret"
carrier = "env var"
issued_by = "operator"
console_key_name = "VIEWS Pipeline Core"
serves_identities = [
  "model/ensemble writer -> production_forecasts",
  "un_fao delivery -> sole writer of unfao_bucket",
  "preflights / validators",
]
observed = """2026-07-31, operator console: 20 scopes, expires ~2026-11-30.
VIOLATES seam contract §5.3 — one key, three identities. Read by BOTH
views-pipeline-core/views_pipeline_core/configs/prediction_store.py:16 and
views-postprocessing/views_postprocessing/unfao/managers/unfao.py:187, so the
publisher into FAO's outbound bucket runs under a key named for another service."""
note = """RETIRED by reissuance under seam contract §5 — but NOT by console action alone:
the incumbent client's ordinary upload path provisions transitively (§5.5 table), so
narrowing scopes today breaks every upload. RATIFIED ORDER (þing-02 D4):
  fix C-231/C-227 -> probe a scoped key -> issue tier keys -> declare schema
  -> relocate create_* -> narrow scopes.
The gate binds before any tier key is ISSUED, not only before narrowing. The probe
key must have DATABASE READ AND NO BUCKET FILE READ (a wholly read-restricted key
false-passes). Narrowing is the acceptance test for the §6 change, and does not
begin before the 20 scopes are enumerated."""

# The caller's key — NOT a platform identity. Listed because it crosses the seam.
[secret.FAO_CALLER_API_KEY]
class = "secret"
carrier = "X-API-Key request header (presented by the caller to views-faoapi, re-used by it)"
console_key_name = "UN FAO"
issued_by = "operator"
owning_contract = "views-faoapi (local ADR) — the compromise and its remediation are that repo's"
observed = """2026-07-31, operator console: 20 scopes, EXACT EXPIRY 2026-11-17 16:10
(supersedes the earlier "~2026-11-30" relay). Serves FAO + developer/ops
simultaneously — a seam contract §5.3 violation, still open."""
history_leak = """CLOSED 2026-07-31 — the leaked value is DEAD. Tested live against
the project by the operator; the key in views-faoapi's notebook history is
indistinguishable from a fabricated one, so it is not a valid key.

Evidence (three-way discrimination on GET /v1/storage/buckets):
  no key at all  -> general_unauthorized_scope, "User (role: guests) missing
                    scopes ([buckets.read])"      <- endpoint DOES discriminate
  fabricated key -> user_unauthorized
  notebook key   -> user_unauthorized             <- byte-identical to fabricated

Timeline: pasted 2025-10-24, re-added 2025-10-27 (views-faoapi d7988a8, 1d9867f,
49fd655); removed from the TREE 2026-06-26 (1930280) but retained in history.
Current keys expire 2026-11-17, so on a 12-month expiry they were issued
~2025-11-17 — three weeks after the paste, which is what retired it.

Consequence: this NO LONGER GATES THE CLONES. A history scrub of the three
notebooks is optional hygiene, not remediation — a dead key in history is a wart,
not a risk. Revoke-then-scrub ordering is moot because revocation already
happened, by reissuance, before anyone noticed the paste."""
open_item = "O2 — confused-deputy half unresolved (seam contract §9)"

# --- Incoming consumers, one credential slot each (§5.3's floor) -------------
# The floor: no key is held by two parties who could need revoking separately.
# views-crafdapi is a SECOND EXTERNAL PARTY and views-productionapi a THIRD
# holder, so neither may share a key with FAO or with each other. Issuing these
# is free at repo creation and a coordinated migration afterwards — which is the
# whole reason they are declared before the repos exist.

[secret.CRAFD_CALLER_API_KEY]
class = "secret"
status = "planned — operator issues at views-crafdapi creation"
carrier = "X-API-Key request header (presented by the caller, re-used by the API)"
consumer = "views-crafdapi"
scopes = "files.read, documents.read, databases.read — read tier only (§5.2)"
note = """Second external party. Must NOT share FAO's key: §5.3's floor, and the
UN FAO key is the worked example of what sharing costs (it serves FAO and this
platform's dev/ops at once and cannot be revoked for one without the other).
Inherits O2's open confused-deputy question (§9) — this slot records the key,
not a decision that re-using a caller's credential for storage is correct."""

[secret.PRODUCTIONAPI_API_KEY]
class = "secret"
status = "planned — operator issues at views-productionapi creation"
consumer = "views-productionapi"
scopes = "PENDING — see note; do not copy the read tier without deciding"
note = """views-productionapi is a WRITE API by definition, so its scopes are not
simply the read tier. Two things gate this slot and both are in §5.5's ordering:
(1) no scoped writer key is issued before C-231/C-227 ship, because a correctly
scoped key meeting the unfixed delete branch begins deleting valid metadata;
(2) the scoped-key probe must pass first, with the normative shape — database
read and no bucket file read. Fill the scopes when those gates clear, not now."""

[secret.APPWRITE_READ_API_KEY]
class = "secret"
status = "planned — operator issues (D4)"
identity = "one per reading identity x environment (§5.3) — not one shared read key"
scopes = "files.read, documents.read, databases.read"

[secret.APPWRITE_WRITE_API_KEY]
class = "secret"
status = "planned — operator issues (D4). Blocked on the create_* gating (§5.5)."
identity = "one per writing identity x environment — views-delivery and un_fao delivery are DIFFERENT identities"
scopes = "files.read, files.write, documents.read, documents.write, buckets.read, databases.read, collections.read"

[secret.APPWRITE_PROVISION_API_KEY]
class = "secret"
status = "planned — operator issues (D4). NEVER given to a long-running process."
scopes = "buckets.write, databases.write, collections.write, attributes.write"

# Not a slot yet — a carrier with no home. See seam contract §9 O3.
[unmodelled.session_auth_email_password]
class = "secret (carrier: email + password)"
location = "views-pipeline-core/views_pipeline_core/modules/appwrite/file.py:359-412 (SessionAuth)"
note = """Fits none of §5.2's three tiers and appears in no slot. The excision
recorded in §2 is views-faoapi #274 and covers faoapi only. Either excise on the
pipeline-core lineage too, or declare it as a slot with an owner."""


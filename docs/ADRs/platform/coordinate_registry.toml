# ============================================================================
# HOW TO RESERVE A COORDINATE THAT HAS NO VALUE YET — READ BEFORE ADDING ONE
# ============================================================================
# This is a STANDING RULE about the shape of this file. It is not about any
# particular entry, and it stays here when no reservation exists — which is the
# state right now: there are currently NO reserved slots. (Until 2026-08-02 this
# block sat directly above four value-less CRAFD entries and said "THESE"; once
# those graduated, the word pointed at nothing and the warning read as stale
# prose contradicting the data below it. C-54.)
#
#     A value-less entry belongs in [planned.*]. Never in [target] or
#     [connection], no matter what `status` you give it.
#
# WHY. The canonical readers — views-models/tools/credentials/registry_to_env.py,
# views-faoapi/deployment/registry_to_env.py, views-crafdapi/deployment/registry_to_env.py
# — scan exactly two tables, `connection` and `target`. On an entry there with no
# `value` they do NOT degrade; they do one of two things, and as of 2026-08-02
# they no longer agree on which:
#
#     no value, no status         -> ALL THREE raise
#                                    ValueError: registry coordinate 'X' … has no value
#     no value, status="planned…" -> views-faoapi and views-crafdapi RAISE;
#                                    views-models SKIPS IT and continues,
#                                    emitting a partial coordinate set.
#
# That split is tracked as C-51 / D-05 and is NOT settled. Do not rely on either
# behaviour. Both are dangerous here for different reasons:
#
#   - A raise means the delivery gets NO coordinates at all. `un_fao/run.sh`
#     exports only GITHUB_TOKEN and APPWRITE_DATASTORE_API_KEY from `.env`, so
#     coordinates reach the child process ONLY from this file.
#   - A skip is worse, because it is silent. The delivery runs against a registry
#     that is missing exactly the names nobody filled in, and nothing says so.
#
# THIS ALREADY HAPPENED. Commit 2186d45 put four value-less slots in [target] and
# every registry read on the platform failed for about a day, unnoticed (C-29).
# Note what changed since: that commit used `status = "planned — …"`, so under
# today's views-models reader it would no longer crash loudly — it would hand the
# UN FAO delivery 12 of 16 coordinates in silence. The incident that taught the
# platform this lesson can no longer reproduce itself the way it is written down.
#
# A planned slot is a DECLARATION OF INTENT, not a coordinate. It becomes a
# coordinate the day it has a value, and only then does it move to [target].
# Slots are declared BEFORE the consuming repo exists on purpose: §5.3's
# credential floor is "free at creation and a migration afterwards", which only
# holds if there is somewhere to read a coordinate from on day one. A repo that
# finds no slot invents one locally — the pathology this registry exists to remove.
#
# Do NOT fill a reservation with a plausible-looking placeholder. A placeholder
# that later gets used verbatim is the "production coordinates reachable without
# a deliberate choice" hazard class (C-21). The operator sets values in the
# console; this file records them afterwards.
#
# Guarded by tests/test_registry_reader_contract.py and
# tests/test_registry_readers_agree.py in this repo.
# ============================================================================

# NAMING: the þing-02 record calls the CRAFD consumer "un-crafdapi" (28
# occurrences). The operator has since named it "views-crafdapi", which also
# matches the views-* convention every other repo on the platform follows. This
# file uses views-crafdapi; the former name is recorded so the þing record stays
# findable.

# The four CRAFD slots below were RESERVED as an inference (views-crafdapi is a
# direct clone of views-faoapi serving a second external party; faoapi's shape is
# "external party reads a curated outbound bucket", so a bucket of its own was the
# clone's shape, not a new decision). CONFIRMED 2026-08-02: the operator created a
# dedicated bucket + metadata collection in the Appwrite console (views-crafdapi S9,
# #10) — exactly the inferred shape — so they graduate from [planned] to [target].

[target.APPWRITE_CRAFD_BUCKET_ID]
class = "target"
value = "crafd_bucket"
consumer = "views-crafdapi"

[target.APPWRITE_CRAFD_BUCKET_NAME]
class = "target"
value = "CRAFD Bucket"
consumer = "views-crafdapi"

[target.APPWRITE_CRAFD_COLLECTION_ID]
class = "target"
value = "crafd"
consumer = "views-crafdapi"

[target.APPWRITE_CRAFD_COLLECTION_NAME]
class = "target"
value = "CRAFD File Metadata"
consumer = "views-crafdapi"

# views-productionapi has NO target slots here, deliberately.
#
# Everything the record establishes about it is that it is "a write API by
# definition" (þing-02 orð_13 §2, þingmenn). Nothing says it needs its own
# bucket. The unfao_bucket precedent does NOT generalise: FAO has a separate
# bucket because it receives a CURATED SUBSET — which is why the eligibility
# lists exist — and a write API may simply write to production_forecasts, the
# shelf that already exists.
#
# Declaring slots for a container nobody has decided on would assert an
# architecture as canonical when no one chose it, which is the same defect as
# filling in a placeholder value. It also risks C-228: a coordinate named
# APPWRITE_PRODUCTIONAPI_BUCKET_ID sits one glance away from
# APPWRITE_PROD_FORECASTS_BUCKET_ID in a sorted .env, and a wrong bucket id
# silently provisions new production storage rather than failing.
#
# OPEN QUESTION, to be answered before views-productionapi is cut:
#   does it write to production_forecasts, or to a store of its own?
# If a store of its own, add the slots then — with a token that cannot be
# misread against PROD_FORECASTS.
#
# Its CREDENTIAL slot is declared regardless (see PRODUCTIONAPI_API_KEY below):
# §5.3's floor binds on the holder, not on which container it touches.

# ------------------------------------------------------- secret SLOTS (no values!)
[secret.APPWRITE_DATASTORE_API_KEY]
class = "secret"
carrier = "env var"
issued_by = "operator"
console_key_name = "VIEWS Pipeline Core"
serves_identities = [
  "model/ensemble writer -> production_forecasts",
  "un_fao delivery -> sole writer of unfao_bucket",
  "preflights / validators",
  "crafd delivery -> sole writer of crafd_bucket (ADDED v1.4.0 — see below)",
]
observed = """2026-07-31, operator console: 20 scopes, expires ~2026-11-30.
VIOLATES seam contract §5.3 — one key, FOUR identities (three until v1.4.0). Read by
views-pipeline-core/views_pipeline_core/configs/prediction_store.py:16 and
views-postprocessing/views_postprocessing/unfao/managers/unfao.py:187, so the
publisher into FAO's outbound bucket runs under a key named for another service.

THE FOURTH IDENTITY ARRIVED WITHOUT ANYONE DECIDING IT (C-57). While the four
APPWRITE_CRAFD_* names sat in [planned], no reader emitted them, so
views-postprocessing/views_postprocessing/crafd/managers/crafd.py could never get
past its assert_env_declared() and the CRAFD writer path was unreachable. Granting
those names values in v1.4.0 is what made it live — it builds its writer with
credentials=os.getenv("APPWRITE_DATASTORE_API_KEY"), like the other three.

This matters for the SPLIT, not for today's running system: the remediation
(views-faoapi#338) is sized from THIS list. A split that cuts over three holders
and then narrows or revokes this key stops the CRAFD delivery silently, because
the fourth holder was never on anyone's inventory."""
note = """RETIRED by reissuance under seam contract §5 — but NOT by console action alone:
the incumbent client's ordinary upload path provisions transitively (§5.5 table), so
narrowing scopes today breaks every upload. RATIFIED ORDER (þing-02 D4):
  fix C-231/C-227 -> probe a scoped key -> issue tier keys -> declare schema
  -> relocate create_* -> narrow scopes.
The gate binds before any tier key is ISSUED, not only before narrowing. The probe
key must have DATABASE READ AND NO BUCKET FILE READ (a wholly read-restricted key
false-passes). Narrowing is the acceptance test for the §6 change, and does not
begin before the 20 scopes are enumerated."""

# The caller's key — NOT a platform identity. Listed because it crosses the seam.
[secret.FAO_CALLER_API_KEY]
class = "secret"
carrier = "X-API-Key request header (presented by the caller to views-faoapi, re-used by it)"
console_key_name = "UN FAO"
issued_by = "operator"
owning_contract = "views-faoapi (local ADR) — the compromise and its remediation are that repo's"
scopes_enumerated = """2026-08-02, read from the console by the operator — the FIRST time any
seat has seen this list. þing-02 recorded it as unknowable from evidence (S22, S36) and
every least-privilege clause was written against it unseen.

DATABASES (16 of 17 ticked):
  databases.read   databases.write
  tables.read      tables.write
  columns.read     columns.write
  indexes.read     indexes.write
  rows.read        rows.write
  collections.read collections.write     [DEPRECATED]
  attributes.read  attributes.write      [DEPRECATED]
  documents.read   documents.write       [DEPRECATED]
  NOT ticked: dedicatedDatabases.execute

STORAGE (4 of 6 ticked):
  buckets.read     buckets.write
  files.read       files.write
  NOT ticked: tokens.read, tokens.write

ZERO scopes in: Project, Auth, Backups, Functions, Sites, Messaging, Proxy,
Other, Advisor, Presences, Domains, Apps.

Total 20, matching the key-list summary."""
scopes_finding = """This key is presented by an EXTERNAL PARTNER to read forecasts. In Appwrite,
`.write` means create, update AND delete — the console states so on every line.

So the caller key can DELETE the databases, tables, buckets and files it should
only be reading. It can also alter table structure (columns.write, indexes.write).

`buckets.write` is the scope that makes the phantom-bucket failure possible: a
typo'd bucket id is CREATED rather than raising. Removing it from a long-running
process makes that failure impossible regardless of what the code does — the
substrate-level enforcement of §5.5.

Why 16 and not 10: collections/attributes/documents are Appwrite's OLD names for
tables/columns/rows, and BOTH generations are ticked. Consumers pin
appwrite==19.2.0 (faoapi ADR-019), which may still call the deprecated surface —
verify which generation is in use before removing either.

A read-only consumer needs roughly four: files.read, rows.read (or
documents.read), databases.read, tables.read (or collections.read). Twenty is
five times the requirement."""
observed = """2026-07-31, operator console: 20 scopes, EXACT EXPIRY 2026-11-17 16:10
(supersedes the earlier "~2026-11-30" relay). Serves FAO + developer/ops
simultaneously — a seam contract §5.3 violation, still open."""
history_leak = """CLOSED 2026-07-31 — the leaked value is DEAD. Tested live against
the project by the operator; the key in views-faoapi's notebook history is
indistinguishable from a fabricated one, so it is not a valid key.

Evidence (three-way discrimination on GET /v1/storage/buckets):
  no key at all  -> general_unauthorized_scope, "User (role: guests) missing
                    scopes ([buckets.read])"      <- endpoint DOES discriminate
  fabricated key -> user_unauthorized
  notebook key   -> user_unauthorized             <- byte-identical to fabricated

Timeline: pasted 2025-10-24, re-added 2025-10-27 (views-faoapi d7988a8, 1d9867f,
49fd655); removed from the TREE 2026-06-26 (1930280) but retained in history.
Current keys expire 2026-11-17, so on a 12-month expiry they were issued
~2025-11-17 — three weeks after the paste, which is what retired it.

Consequence: this NO LONGER GATES THE CLONES. A history scrub of the three
notebooks is optional hygiene, not remediation — a dead key in history is a wart,
not a risk. Revoke-then-scrub ordering is moot because revocation already
happened, by reissuance, before anyone noticed the paste."""
open_item = "O2 — confused-deputy half unresolved (seam contract §9)"

# --- Incoming consumers, one credential slot each (§5.3's floor) -------------
# The floor: no key is held by two parties who could need revoking separately.
# views-crafdapi is a SECOND EXTERNAL PARTY and views-productionapi a THIRD
# holder, so neither may share a key with FAO or with each other. Issuing these
# is free at repo creation and a coordinated migration afterwards — which is the
# whole reason they are declared before the repos exist.

[secret.CRAFD_CALLER_API_KEY]
class = "secret"
status = "ISSUED 2026-08-02 — operator, via the Appwrite console (views-crafdapi S9, #10)"
console_key_name = "crafd-caller-read"
carrier = "X-API-Key request header (presented by the caller, re-used by the API)"
consumer = "views-crafdapi"
issued_by = "operator"
scopes = "databases.read, rows.read, documents.read, files.read — read tier only, zero write (§5.2)"
scopes_enumerated = """2026-08-02, ticked in the console at creation. The read tier, plus
rows.read (the TablesDB-era twin of the now-deprecated documents.read, so the key reads via
either the classic documents API or the new rows API). NO .write/.delete on any resource;
zero scopes in every other category. A clean per-party read key — the model views-faoapi#338
moves the shared UN FAO key toward.

The secret VALUE is not recorded here; the operator holds it."""
scopes_insufficient = """⚠ AS ISSUED, THIS KEY CANNOT AUTHENTICATE A SINGLE REQUEST (C-56).
Two scopes are missing, and the first is fatal:

  buckets.read   — views-crafdapi validates EVERY key by calling list_buckets:
                   `_validate_api_key` -> manager.list_buckets(limit=1) ->
                   GET /v1/storage/buckets, at
                   views-crafdapi/src/views_crafdapi/managers/api.py:297, raising
                   HTTPException(401) when it fails. It is reached through
                   Depends on every route, including /health. This file already
                   proves the outcome: the operator's own probe (history_leak
                   above) records that this exact endpoint answers
                   `general_unauthorized_scope, "missing scopes ([buckets.read])"`.
  tables.read    — or collections.read. This file's own read-only recipe
                   (FAO_CALLER_API_KEY.scopes_finding) names four scopes a read
                   consumer needs; the issued key satisfies two of them.

FAO's key hides the requirement because it holds buckets.read, so the existing
deployment gives no warning that a read-tier key needs it.

RESOLUTION: operator console action — tick buckets.read and tables.read on
`crafd-caller-read`. Blocks views-crafdapi S11 (#12), whose acceptance criterion
is `smoke ALL PASS`. Not a code change; do NOT relax the validation to fit the key,
because the validation is what makes an invalid key fail at the door."""
destination = """The holder is CRAF'd, not this platform. Per `carrier` above, the key is
presented BY the caller in the X-API-Key header and re-used by the API against Appwrite.

There is NO env slot for it, and there must not be one until O2 is settled (C-58).
Confirmed: `_REQUIRED_APPWRITE_ENV_VARS` in views-crafdapi lists no caller-key variable,
the key arrives via Header(...) and goes straight to the SDK, and the name
CRAFD_CALLER_API_KEY appears in NO code anywhere in the workspace — only here and in the
risk register entry that tracks this (C-58). Nothing reads it because nothing is meant to.

An earlier draft of this slot said the value "goes into the views-crafdapi deployment env
at first deploy, S11". That contradicted `carrier` eight lines above and named a
destination that does not exist. Following it literally installs the key on a host where
nothing reads it and never sends it to the party who must present it: every request 401s
while the checklist reads done. Adding an env var to make that sentence true would answer
§9's confused-deputy question (O2) in the direction this slot's own `note` says it is not
deciding. The sentence was wrong; the code is right."""
note = """Second external party. Must NOT share FAO's key: §5.3's floor, and the
UN FAO key is the worked example of what sharing costs (it serves FAO and this
platform's dev/ops at once and cannot be revoked for one without the other).
Inherits O2's open confused-deputy question (§9) — this slot records the key,
not a decision that re-using a caller's credential for storage is correct."""

[secret.PRODUCTIONAPI_API_KEY]
class = "secret"
status = "planned — operator issues at views-productionapi creation"
consumer = "views-productionapi"
scopes = "PENDING — see note; do not copy the read tier without deciding"
note = """views-productionapi is a WRITE API by definition, so its scopes are not
simply the read tier. Two things gate this slot and both are in §5.5's ordering:
(1) no scoped writer key is issued before C-231/C-227 ship, because a correctly
scoped key meeting the unfixed delete branch begins deleting valid metadata;
(2) the scoped-key probe must pass first, with the normative shape — database
read and no bucket file read. Fill the scopes when those gates clear, not now."""


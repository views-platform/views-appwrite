                                           # CRAFD caller key recorded as issued. OBSERVATION-DRIVEN — §10's
                                           # distinction: this bump records state the operator created, it
                                           # imposes no new obligation on any consumer.
                                           # v1.3.0 (2026-07-31): secret slots corrected against operator console.


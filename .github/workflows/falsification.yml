name: Falsification

# REPORTING ONLY. This job NEVER blocks a merge, and that is deliberate.
#
# Sixteen tests in this repository are red BY DESIGN. Each encodes an unresolved
# risk-register finding and turns green only when that finding is fixed.
# docs/contributor_protocols/carbon_based_agents.md §1-2: a stub "is expected-red
# until the register finding it encodes is resolved" and "must not be deleted to
# make a gate pass". Blocking on them would make deleting one the fastest way to
# ship, which is the single behaviour the protocol forbids.
#
# DO NOT ADD THIS JOB TO THE RULESET'S REQUIRED CHECKS. If a future reader thinks
# a reporting job is a half-measure: the blocking half is `Guards`, which runs the
# checks that protect live invariants. This job watches a different thing.
#
# WHAT IT IS ACTUALLY FOR: a stub that goes GREEN.
#
# A red stub is the normal state and needs no announcement. A stub that PASSES
# means its finding may have been resolved -- good news -- or that its assertion
# was quietly weakened until it stopped failing, which is C-68 and is not.
# Either way somebody must look, and today nobody is told.
#
# C-68 was caught only because a human ran pytest and noticed the failure count
# move 10 -> 9. That is the whole detection mechanism this job replaces.
#
# It is not hypothetical: at the time this job was written, SIX of the sixteen
# stubs were already green and had been for an unknown length of time. Nothing
# had reported them.

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: falsification (reporting only)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # SIBLINGS, IN A REPORTING JOB, ON PURPOSE.
      #
      # Some stubs read other repositories -- `test_falsify_c40_every_consumer_pins_
      # the_contract` walks each consumer looking for unpinned citations. On a lone
      # runner `root.exists()` is False for every one, it finds no offenders, and it
      # PASSES. Green because it could not look.
      #
      # This was not theory: the first run of this job reported SEVEN green stubs
      # where the same suite reports six locally. The extra one was c40, passing
      # vacuously. A job whose whole purpose is to say "this stub is green, go and
      # check why" would have sent someone after a finding that was never resolved.
      #
      # Only the two PUBLIC siblings are fetched. views-faoapi is private and stays
      # out (#73 withdrawn on views-postprocessing ADR-017 §9), so c40 still cannot
      # see one of the five consumers -- stated in the summary rather than left to
      # look like completeness.
      - name: Check out the public siblings the stubs read
        uses: actions/checkout@v4
        with:
          repository: views-platform/views-models
          ref: main
          path: _siblings/views-models

      - name: Check out views-crafdapi
        uses: actions/checkout@v4
        with:
          repository: views-platform/views-crafdapi
          ref: main
          path: _siblings/views-crafdapi

      # The stubs resolve siblings as WORKSPACE/<repo>, where WORKSPACE is the
      # parent of the repo root. actions/checkout cannot place a repo above the
      # workspace, so they land in _siblings/ and are linked into place.
      - name: Put the siblings where the stubs look for them
        run: |
          set -euo pipefail
          for r in views-models views-crafdapi; do
            ln -sfn "$PWD/_siblings/$r" "$(dirname "$PWD")/$r"
            test -d "$(dirname "$PWD")/$r" || { echo "::error::$r did not land"; exit 1; }
          done
          echo "siblings visible to the stubs:"
          ls -d "$(dirname "$PWD")"/views-* | sed 's/^/  /'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --quiet pytest

      # `|| true` is the non-blocking half and belongs HERE rather than on the job:
      # `continue-on-error` at job level marks the whole job neutral in the UI,
      # which reads as "did not run". This runs, reports, and succeeds.
      #
      # JUnit XML rather than parsing pytest's console output: the summary below
      # names every test, and screen-scraping `-v` output would break silently the
      # first time pytest changes a format string. A reporting job that misreports
      # is worse than no reporting job.
      # `tests/` and `--ignore=_siblings` are BOTH load-bearing, and the first run
      # without them proved it. The siblings are checked out INSIDE the workspace
      # (actions/checkout cannot write above it), so a bare `pytest` walked into
      # `_siblings/*/tests/` and collected THEIR suites. The report came back
      # "2 red, 0 green", the two being collection errors from other repositories,
      # and none of this repo's sixteen stubs ran at all.
      #
      # views-postprocessing hit the same shape from the other side -- a sibling
      # placed outside their `_siblings/` dir made their linter report 745 findings
      # in someone else's code (their ADR-016, rule G6). Fetching a sibling into the
      # workspace is not free: every tool that walks the tree now sees it.
      - name: Run the falsification stubs
        run: |
          python -m pytest -m falsification -q --tb=no \
            tests/ --ignore=_siblings \
            --junit-xml=falsification.xml || true

      - name: Report which stubs are red, and shout about any that are green
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET

          root = ET.parse("falsification.xml").getroot()
          red, green = [], []
          for case in root.iter("testcase"):
              name = f"{case.get('classname','').split('.')[-1]}::{case.get('name')}"
              (red if any(k.tag in ("failure", "error") for k in case) else green).append(name)

          lines = [
              "## Falsification stubs",
              "",
              f"**{len(red)} red** (expected) · **{len(green)} green** (needs a look)",
              "",
          ]

          if green:
              lines += [
                  "### :rotating_light: Green stubs — someone must look",
                  "",
                  "A passing stub means either its register finding is resolved -- in which case",
                  "convert it to a plain assertion and close the entry -- or its assertion was",
                  "weakened until it stopped failing, which is **C-68** and must be reverted.",
                  "",
              ]
              for n in green:
                  lines.append(f"- `{n}`")
                  # A workflow annotation, so it is visible without opening the summary.
                  print(f"::notice title=Falsification stub is GREEN::{n} — resolve and convert it, "
                        f"or restore the assertion if it was weakened (C-68)")
              lines.append("")

          lines += ["### Red stubs — expected, no action", ""]
          lines += [f"- `{n}`" for n in red]
          lines += [
              "",
              "### What this run could not see",
              "",
              "Two public siblings are checked out — `views-models`, `views-crafdapi` — because",
              "some stubs read other repositories and would otherwise pass by finding nothing.",
              "**`views-faoapi` is private and is not fetched** (views-appwrite#73, withdrawn on",
              "views-postprocessing ADR-017 §9), so any stub walking every consumer sees four of",
              "five. Stated because an unstated absence reads as coverage.",
              "",
              "---",
              "",
              "_This job never blocks. Stubs are red by design; deleting one to make a gate",
              "pass is forbidden by the carbon protocol §1-2. The blocking checks are in_ `Guards`.",
          ]

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: falsification-junit
          path: falsification.xml
          if-no-files-found: ignore

name: Guards

# The gating job. Runs the checks that protect this repository's live invariants.
#
# WHY THIS EXISTS (C-70, epic #66). Until 2026-08-08 this repo had no workflows at
# all, so nobody could believe it was mechanically covered. It then acquired a
# full-history secret scan, the ruleset made that scan a REQUIRED check -- and the
# scan verifies nothing about the coordinate registry. The appearance of coverage
# arrived without the coverage.
#
# Concretely: commit 2186d45 put four value-less slots in [target] and made the
# registry unreadable platform-wide for a day (C-29). The guard written afterwards
# catches it, but ran only when a human remembered `pytest`. That commit would have
# merged with a green tick.
#
# WHAT RUNS HERE, AND WHAT DOES NOT
#   this job   `-m guard` over the SELF-CONTAINED guards + docs/validate_docs.sh.
#              Needs nothing outside this repository.
#   NOT here   tests/test_registry_readers_agree.py -- it needs sibling checkouts
#              and gets its own job (story #69). Running it here would fail on a
#              lone runner for the wrong reason: its anti-vacuity assertion
#              `test_at_least_one_reader_is_present` correctly FAILS when no
#              readers are present, which is right, and useless as a signal here.
#   NOT here   the falsification stubs. Red by design; reporting-only job (#70).
#
# The `guard` / `falsification` split is DECLARED via markers in tests/conftest.py,
# not inferred from filenames -- ADR-003, and the registry's own rule about itself.
# tests/test_test_kinds.py fails if any module declares neither.

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-contained:
    name: guards (self-contained)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # docs/validate_docs.sh check 8 compares the working tree against
      # origin/main -- the ref consumers actually resolve. actions/checkout does
      # NOT create it, and the script's skip path prints a note and exits 0. So
      # without this fetch the job goes green with C-53's guard inert.
      #
      # The script ALSO errors rather than skips when CI is set, so if this step
      # is ever removed the build fails loudly instead of quietly narrowing. Two
      # mechanisms on purpose: this step is the one most likely to be tidied away.
      # Check 9 needs TAGS as well, and `actions/checkout` fetches none by default. Without
      # this second fetch, check 9's tag half would take its skip path on every CI run --
      # which is the C-76 guard inert on the exact surface it was written for. The script
      # ALSO errors rather than skips when CI is set and no tags are present, so removing
      # this line fails the build loudly instead of quietly narrowing. Same belt-and-braces
      # as the fetch above, for the same reason: a workflow step is the thing most likely
      # to be tidied away later.
      - name: Fetch origin/main so the version check can run
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: Fetch tags so the README pinning check can run
        run: git fetch --depth=1 origin '+refs/tags/appwrite-seam-v*:refs/tags/appwrite-seam-v*'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # >=3.11 for stdlib tomllib; see below

      - name: Install pytest
        run: python -m pip install --quiet pytest

      # No `tomli` install: 3.12 has stdlib tomllib. The tests fall back to tomli
      # only below 3.11 and FAIL rather than skip if neither exists -- that
      # fallback exists because these tests once skipped silently on 3.10, on the
      # exact registry break they were written to catch.
      - name: Registry-shape guards
        run: python -m pytest -q -m guard tests/test_registry_reader_contract.py tests/test_test_kinds.py

      - name: Documentation and version checks
        run: bash docs/validate_docs.sh

  cross-repo:
    name: guards (cross-repo)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # WHICH BRANCH, AND WHY IT IS NOT `main`.
      #
      # views-postprocessing's ADR-016 rule G7 says name a sibling's branch
      # explicitly rather than accept whatever default it happens to carry. Agreed --
      # and naming it forces the question of WHICH, which has a non-obvious answer:
      #
      #   views-models   reader exists ONLY on `development`. Their `main` is 407
      #                  commits behind and does not contain the file at all.
      #   views-crafdapi reader on both; `main` is 11 behind `development`.
      #
      # So `development` for both. Comparing views-models' `main` would compare
      # against a reader that is not there, and comparing crafdapi's `main` would
      # compare a current reader against a stale one and call any difference
      # "divergence". The guard asks whether the readers agree TODAY; `development`
      # is where each repo's reader actually is.
      #
      # The cost, stated: `development` moves, so this compares a moving target. For
      # a drift detector that is the point, not a defect.
      #
      # Cloned to the PARENT directory because the tests resolve siblings as
      # WORKSPACE/<repo> (WORKSPACE = the repo root's parent), and because a sibling
      # inside the workspace gets collected by pytest -- that mistake cost two runs
      # in the falsification job and 745 spurious linter findings in
      # views-postprocessing (their ADR-016 G6).
      - name: Clone the two public sibling readers
        run: |
          set -euo pipefail
          parent="$(dirname "$PWD")"
          # GIT_LFS_SKIP_SMUDGE: views-crafdapi stores GAUL shapefiles in LFS, and
          # the smudge filter failed the first run outright -- exit 128, no clone.
          # This job needs exactly one 40-line Python file from each sibling and has
          # no use for their binary assets. Skipping smudge leaves LFS pointers in
          # place, which is fine because nothing here reads them, and it removes a
          # dependency on someone else's LFS quota and availability.
          export GIT_LFS_SKIP_SMUDGE=1
          for repo in views-models views-crafdapi; do
            git clone --depth 1 --branch development --quiet \
              "https://github.com/views-platform/$repo.git" "$parent/$repo"
          done
          ls -d "$parent"/views-* | sed 's/^/  cloned: /'

      # THE ANTI-VACUITY GATE, and the reason this job exists at all.
      #
      # `_present()` in the test filters declared readers by is_file() and drops the
      # missing ones SILENTLY. That tolerance is right on a laptop -- not everyone
      # checks out five repos -- and it is exactly what made C-52 vacuous: the guard
      # pointed at a path that had moved, dropped views-models without a word, and
      # spent its whole life comparing views-faoapi against views-crafdapi, two
      # byte-identical clones that agree trivially.
      #
      # In CI the tolerance must not apply. If this job says it cloned two readers
      # then two readers must be there, and finding fewer is a failure rather than a
      # smaller comparison. Checked BEFORE pytest so the failure names the cause
      # instead of surfacing as a confusing skip.
      - name: Refuse to run against fewer readers than we cloned
        run: |
          set -euo pipefail
          parent="$(dirname "$PWD")"
          missing=""
          for p in "views-models/tools/credentials/registry_to_env.py" \
                   "views-crafdapi/deployment/registry_to_env.py"; do
            [ -f "$parent/$p" ] || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            echo "::error::cloned the repos but these readers are absent:$missing"
            echo "::error::A smaller comparison is not a smaller signal -- it is C-52."
            exit 1
          fi
          echo "both declared readers present"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # >=3.11: the readers need stdlib tomllib

      - name: Install pytest
        run: python -m pip install --quiet pytest

      # views-faoapi is PRIVATE and deliberately absent. views-appwrite#73 proposed a
      # credential to reach it and was WITHDRAWN on views-postprocessing ADR-017 §9:
      # a token is tied to a person, expires, and when it lapses the checks skip while
      # the build stays green -- the exact failure this epic exists to end.
      #
      # So this compares TWO of the three canonical readers, and that is a real gap,
      # not a rounding error. It is stated in the log rather than left to look like
      # completeness. C-51 tracks it.
      #
      # Two is still meaningful: views-models and views-crafdapi genuinely differ
      # today (`_is_planned()` vs raising), so the D-05 divergence is visible here
      # without any credential.
      - name: Reader agreement
        run: |
          echo "::notice title=Cross-repo coverage::Comparing 2 of 3 canonical readers. \
          views-faoapi is private and not fetched (#73 withdrawn, ADR-017 §9). C-51 tracks the gap."
          python -m pytest -q -m guard tests/test_registry_readers_agree.py -v

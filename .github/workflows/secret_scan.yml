name: Secret Scan

# Full-history credential scan. The exit code is the verdict.
#
# WHY THIS REPO NEEDS IT, SPECIFICALLY. The coordinate registry is designed to be
# non-secret: "Coordinates are NON-SECRET identifiers. Secrets appear only as SLOTS
# (name + required scopes) -- NEVER as values." `tests/test_registry_reader_contract.py
# ::test_no_secret_carries_a_value` enforces that for the CURRENT file.
#
# It says nothing about HISTORY. A value committed and later removed is still in the
# git objects, and this repository is a candidate for being made public — at which
# point history becomes public too, irreversibly. That is what this job covers, and
# nothing else in this repo did: there were no workflows here at all.
#
# Adapted from views-models/.github/workflows/secret_scan.yml, whose comments record
# why each guard exists. Both guards are kept; the vacuity floor is RECALIBRATED,
# see below.
#
# TWO WAYS THIS JOB COULD LIE, both guarded. A secret scan that cannot fail is worse
# than no scan, because the platform would believe it is covered.
#
#   1. SHALLOW CLONE. actions/checkout defaults to fetch-depth: 1. gitleaks would scan
#      one commit, find nothing, exit 0 — green forever and worthless. Hence
#      `fetch-depth: 0`.
#   2. A SILENTLY NARROWED SCAN — an edited --log-opts, or a future gitleaks changing
#      what `--all` means, in a repository that is genuinely complete.
#
# `git rev-parse --is-shallow-repository` is the independent witness and must be
# checked FIRST: in a shallow clone the ratio below compares two numbers that are both
# truncated, agree with each other, and pass.
#
# WHY THE FLOOR DIFFERS FROM views-models. That repo compares commits-scanned against
# `git rev-list --count --all`, which INCLUDES merges that gitleaks does not walk — so
# its floor has to be loose (50%) to absorb the gap. Its own composition is 87%
# non-merge; this repository's is 63% (42 of 66, measured 2026-08-08), so the same 50%
# floor would leave only 13 points of headroom and would false-fail as merges
# accumulate.
#
# Comparing against the NON-MERGE count instead compares like with like: gitleaks walks
# non-merge commits, so the expected ratio is ~100% regardless of how many merges the
# history carries, and the floor can be tight without becoming brittle. This is a
# correction worth carrying back to views-models rather than a local quirk.

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned deliberately. "Latest" would mean the verdict changes without a commit.
  # Version and digest match views-models, where this pair is already exercised.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  # Against the NON-MERGE count, so the expected value is ~100%. A shallow clone
  # scans ~1 and fails this by a wide margin.
  MIN_SCANNED_FRACTION_PERCENT: "90"

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - name: Check out FULL history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # see guard 1 above — do not remove

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan full history
        id: scan
        run: |
          set -uo pipefail
          # --redact: findings are reported by rule/file/commit/line, never by value,
          # so a leak is not re-published in a CI log while being reported.
          ./gitleaks git \
            --log-opts="--all --full-history" \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            2>&1 | tee scan.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Assert the scan actually walked the history
        run: |
          set -euo pipefail

          # GUARD 1 — the independent witness. Must come first: in a shallow clone the
          # ratio check below compares two numbers that are both truncated, agree with
          # each other, and pass.
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::This is a SHALLOW clone. gitleaks will report 'no leaks found'"
            echo "::error::after scanning ~1 commit and exit 0 — a green that proves"
            echo "::error::nothing. Restore 'fetch-depth: 0' on actions/checkout."
            exit 1
          fi

          # GUARD 2 — like compared with like. gitleaks walks non-merge commits.
          total=$(git rev-list --count --all --no-merges)
          scanned=$(grep -oE '[0-9]+ commits scanned' scan.log | grep -oE '^[0-9]+' | head -1 || true)

          if [ -z "$scanned" ]; then
            echo "::error::Could not read a commit count from gitleaks output. The"
            echo "::error::vacuity guard cannot confirm the scan walked the history, so"
            echo "::error::this run proves nothing. Failing rather than passing blind."
            exit 1
          fi

          floor=$(( total * MIN_SCANNED_FRACTION_PERCENT / 100 ))
          echo "non-merge commits : $total"
          echo "commits scanned   : $scanned"
          echo "floor (${MIN_SCANNED_FRACTION_PERCENT}%) : $floor"

          if [ "$scanned" -lt "$floor" ]; then
            echo "::error::gitleaks scanned $scanned of $total non-merge commits — below"
            echo "::error::the ${MIN_SCANNED_FRACTION_PERCENT}% floor. This is what a shallow or narrowed scan"
            echo "::error::looks like. A clean result from a scan this narrow is"
            echo "::error::meaningless. Check that actions/checkout still sets"
            echo "::error::fetch-depth: 0 and that --log-opts is unchanged."
            exit 1
          fi
          echo "Vacuity guard passed — the scan saw the history."

      - name: Upload findings report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore

      - name: The exit code is the verdict
        run: |
          code="${{ steps.scan.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "::error::gitleaks exited $code — findings are in scan.log and the"
            echo "::error::uploaded SARIF artifact (values redacted). If a finding is"
            echo "::error::benign, add its fingerprint to .gitleaksignore WITH a written"
            echo "::error::justification; an undocumented allowlist entry is"
            echo "::error::indistinguishable from a hidden leak."
            echo "::error::"
            echo "::error::Do NOT make this repository public until this is green."
            exit "$code"
          fi
          echo "No unallowlisted findings in full history."
